name: Apply Armilen branding
description: >
  Patches sources that live in upstream-tracking submodules. The submodules
  keep pointing at rustdesk/* (no second fork to maintain), so upstream syncs
  stay conflict-free; every rebrand patch of submodule code must live in this
  action, not in the workflows that call it. Здесь же живут правки файлов
  основного репозитория, которые апстрим перетряхивает целиком (src/lang/*):
  прямая правка ловила бы конфликт на каждой синхронизации.
runs:
  using: composite
  steps:
    - name: Set APP_NAME to ArmDesk in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/config.rs"
        if grep -qF 'RwLock::new("ArmDesk".to_owned())' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'APP_NAME: RwLock<String> = RwLock::new("RustDesk".to_owned())' "$cfg"; then
          echo "::error file=$cfg::APP_NAME pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # Без пробела: "ArmDesk" ломал парсинг аргументов cmd.exe в
        # windows.rs (reg add/rename видели "Remote" отдельным токеном) -
        # чинили кавычками, но проще и надёжнее убрать пробел у источника.
        # -i.bak + rm работает и с GNU sed (Linux, Git Bash на Windows), и с BSD sed (macOS)
        sed -i.bak 's/APP_NAME: RwLock<String> = RwLock::new("RustDesk"\.to_owned())/APP_NAME: RwLock<String> = RwLock::new("ArmDesk".to_owned())/' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'APP_NAME: RwLock' "$cfg"

    - name: Default ID/relay server to armilen.ru in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/config.rs"
        if grep -qF 'RENDEZVOUS_SERVERS: &[&str] = &["www.armilen.ru"]' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'RENDEZVOUS_SERVERS: &[&str] = &["rs-ny.rustdesk.com"]' "$cfg"; then
          echo "::error file=$cfg::RENDEZVOUS_SERVERS pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        if ! grep -qF 'RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";' "$cfg"; then
          echo "::error file=$cfg::RS_PUB_KEY pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # Без этого клиент по умолчанию соединяется через публичный
        # rs-ny.rustdesk.com (чужой сервер, платный трафик и чужая точка
        # доверия), а UI показывает "настройте собственный сервер" - хотя
        # свой ID/relay (hbbs/hbbr) у нас уже поднят. Значения те же, что
        # даём вручную для официального iOS-клиента.
        sed -i.bak 's/RENDEZVOUS_SERVERS: &\[&str\] = &\["rs-ny\.rustdesk\.com"\]/RENDEZVOUS_SERVERS: \&[\&str] = \&["www.armilen.ru"]/' "$cfg"
        sed -i.bak 's#RS_PUB_KEY: &str = "OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=";#RS_PUB_KEY: \&str = "GYxvuB12rp2WdQoykP0y2Whrw9sD7hpPJkTlp8LS7C0=";#' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'RENDEZVOUS_SERVERS: &[&str]' "$cfg"
        grep -F 'RS_PUB_KEY: &str' "$cfg"

    - name: Point version-check URL at armilen.ru in libs/hbb_common
      shell: bash
      run: |
        set -euo pipefail
        cfg="libs/hbb_common/src/lib.rs"
        if grep -qF 'const URL: &str = "https://www.armilen.ru/api/version-check";' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        if ! grep -qF 'const URL: &str = "https://api.rustdesk.com/version/latest";' "$cfg"; then
          echo "::error file=$cfg::version-check URL pattern not found, upstream changed the line; update this action"
          exit 1
        fi
        # Свой апдейт-чек: api.rustdesk.com/version/latest заменяем на наш
        # эндпойнт, чтобы кастомные клиенты узнавали о новых сборках, а не
        # молчали и не дёргали официальный апстрим.
        sed -i.bak 's#const URL: &str = "https://api.rustdesk.com/version/latest";#const URL: \&str = "https://www.armilen.ru/api/version-check";#' "$cfg"
        rm -f "$cfg.bak"
        grep -F 'const URL: &str' "$cfg"

    - name: Name RU server fields like the guide on the site in src/lang
      shell: bash
      run: |
        set -euo pipefail
        cfg="src/lang/ru.rs"
        if grep -qF '("Key", "Ключ шифрования"),' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        # Клиент и наша инструкция по настройке должны звать поля одинаково,
        # иначе инструкция расходится с тем, что человек видит на экране.
        # Апстримный перевод зовёт их «Сервер ID», «Ретранслятор», «Сервер API»,
        # а ключ не переводит вовсе.
        for old in '("ID/Relay Server", "ID/Ретранслятор"),' '("ID Server", "Сервер ID"),' '("Relay Server", "Ретранслятор"),' '("API Server", "Сервер API"),'; do
          if ! grep -qF "$old" "$cfg"; then
            echo "::error file=$cfg::$old not found, upstream changed the translation; update this action"
            exit 1
          fi
        done
        sed -i.bak 's#("ID/Relay Server", "ID/Ретранслятор")#("ID/Relay Server", "ID/Реле-сервер")#' "$cfg"
        sed -i.bak 's#("ID Server", "Сервер ID")#("ID Server", "ID-сервер")#' "$cfg"
        sed -i.bak 's#("Relay Server", "Ретранслятор")#("Relay Server", "Реле-сервер")#' "$cfg"
        sed -i.bak 's#("API Server", "Сервер API")#("API Server", "API-сервер")#' "$cfg"
        rm -f "$cfg.bak"
        # Ключа в апстримном ru.rs нет, поэтому строку добавляем, а не правим.
        # awk, а не sed: перенос строки в замене BSD sed на macOS не понимает
        awk '{ print } /\("API Server", "API-сервер"\),/ { print "        (\"Key\", \"Ключ шифрования\")," }' "$cfg" > "$cfg.tmp"
        mv "$cfg.tmp" "$cfg"
        grep -F -e '("ID/Relay Server"' -e '("ID Server"' -e '("Relay Server"' -e '("API Server"' -e '("Key"' "$cfg"

    - name: Rename the personal address book to «Личные» in src/lang
      shell: bash
      run: |
        set -euo pipefail
        cfg="src/lang/ru.rs"
        if grep -qF '("My address book", "Личные"),' "$cfg"; then
          echo "Branding already applied, skipping"
          exit 0
        fi
        # Личная книга не переименовывается из админки: сервер отдаёт её на лету
        # (/api/ab/personal), а имя клиент берёт из своей константы
        # _personalAddressBookName и показывает через translate(). То есть
        # единственная точка, где её вообще можно назвать иначе, это перевод.
        #
        # «Моя адресная книга» по смыслу совпадала с книгой, которую владелец
        # заводит руками, и различить их на экране было нельзя. Книги под
        # клиентов и филиалы называются именами клиентов, поэтому личной
        # остаётся «Личные», а никакой «основной» не заводится.
        old='("My address book", "Моя адресная книга"),'
        if ! grep -qF "$old" "$cfg"; then
          echo "::error file=$cfg::$old not found, upstream changed the translation; update this action"
          exit 1
        fi
        sed -i.bak 's#("My address book", "Моя адресная книга")#("My address book", "Личные")#' "$cfg"
        rm -f "$cfg.bak"
        grep -F '("My address book"' "$cfg"
