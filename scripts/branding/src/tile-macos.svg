<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- macOS icns: Apple HIG leaves ~10% transparent margin around a rounded
       tile (~22.4% corner radius). Glyph scaled by the same 412/512 factor as
       the tile so the mark reads at the tile-dark size inside the inset. -->
  <rect x="50" y="50" width="412" height="412" rx="92" fill="#15803d"/>
  <g transform="translate(256,256) scale(0.628) translate(-290,-256)"
     fill="none" stroke-width="72" stroke-linecap="round" stroke-linejoin="round">
    <path d="M120 140 L240 256 L120 372" stroke="#0f172a"/>
    <path d="M340 372 L460 372" stroke="#ffffff"/>
  </g>
</svg>
